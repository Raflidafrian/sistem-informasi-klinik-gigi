
name: DentalCare CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentalcare-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: dentalcare-build
          path: public/build/
          if-no-files-found: error

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dentalcare-build
          path: public/build/

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

      - name: Upload frontend build
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          tar -czf frontend-build.tar.gz -C public build

          scp -P "$SSH_PORT" frontend-build.tar.gz \
            "$SSH_USER@$SSH_HOST:~/frontend-build.tar.gz"

      - name: Deploy Laravel
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd ~/dentalcare-repo && bash deploy.sh"
